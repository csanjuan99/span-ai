# Hand-written policy. ./span quickstart writes span.yaml only when that file is missing.
# The Jira token is not in this file. Each folder keeps its own .span/jira.json.
# span.yaml is optional and is project policy only. A run's feature document, pull request
# title, and commit scope come from its branch; an old feature: line is read and ignored.
# The branch every feat and fix starts from and opens its pull request into, unless the run
# names one (--base, or the desk's Base branch field). A hotfix keeps master, and this line
# never decides the kind. It must exist on origin. Empty: dev for feat/ and fix/.
# base: feat/SAL-3-wallet
# light, standard, or deep. Empty derives it from the story.
run:
  weight: ""
rules: rules.md
# cursor, claude, codex, pi, or any.
agent: any
stages:
  open: auto
  merge: auto
  # How a merge conflict with the base is resolved. hold waits for a person to choose an
  # option; auto applies the first option only when every group is low risk.
  conflict: hold
jira:
  blockStatus: Block
prove:
  # Scoped to the files that declare this story's criteria. {files} is replaced.
  focused:
    - go test {files}
  fast:
    - go test ./...
  acceptance: []
  # Runs once in a run's own git worktree, before its baseline and build, to install what a
  # fresh tree lacks. Never runs in your own checkout.
  prepare: []
  # Run the wide commands once on the base commit before the first build. A failure that
  # was already there is shown as preexisting and does not spend a repair. Default true.
  baseline: true
  # With no focused band from the criteria or above, and a recorded baseline, derive one
  # from the branch's diff:
  # go test runs the changed packages and their importers, vitest and jest their related
  # tests. The wide band still runs once per commit. Default true.
  # diff: true
qa:
  command: go test ./...
  browser: false
  # JUnit XML or Vitest/Jest JSON. Empty looks in test-results/junit.xml and friends.
  report: ""
# How many times a failing check sends the span back to build. 1 to 8.
repair:
  maxAttempts: 3
promote:
  environments:
    - name: preview
      command: echo preview
      mode: auto
manifest:
  build:
    skills: []
    rules:
      - rules.md
    mcp: []
  inspect:
    skills: []
    rules:
      - rules.md
    mcp: []
